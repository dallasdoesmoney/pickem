# Keeps the player tier lists' rosters current - every category in
# scripts/sync-players.mjs - without letting ESPN anywhere near a deploy.
#
# The obvious way to do this is to fetch at build time. That trades a data
# problem for a deploy problem: site.api.espn.com is undocumented and
# unversioned, so the day its shape changes is the day the site stops
# building - and it would also make the same commit produce different
# sites, which quietly breaks rollbacks.
#
# So the fetch happens here instead, on a schedule, and its only output is
# a pull request. If ESPN changes or is down, this job goes red and
# nothing else does. And the diff is worth seeing rather than applying
# blind: a changed starter means every saved board that ranked the old one
# is now carrying a player the template no longer lists.
name: Sync player rosters

on:
  schedule:
    # Tuesdays 12:00 UTC - after the week's games are done and depth
    # charts have settled, and before anyone is ranking Sunday.
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs against stubbed payloads, so it fails on a parsing change
      # before 200 live requests do. ESPN is unreachable from where this
      # was written, which makes it the only pre-flight there is.
      - name: Check the depth chart parsing
        run: node scripts/sync-players.test.mjs

      - name: Pull rosters from ESPN
        run: node scripts/sync-players.mjs

      # The script writes every team or throws, so anything that reaches
      # here is a complete roster. No diff means nothing moved this week.
      - name: Open a pull request if anything moved
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-players
          title: Sync player rosters
          commit-message: Sync player rosters
          body: |
            Generated by `scripts/sync-players.mjs` on a schedule.

            Check the diff before merging: a changed starter means saved
            boards that ranked the outgoing player now reference someone
            the template no longer lists. Those degrade to a face with no
            name (see `resolveItem`), which is fine, but it is worth
            knowing when it happens.
          # The whole directory, not a list. Every generated roster lives
          # in it and nothing else does, so a category added later is
          # picked up without anyone remembering to edit this file.
          add-paths: src/data/rosters/
