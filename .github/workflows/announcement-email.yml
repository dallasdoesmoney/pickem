# Sends a one-off announcement to everybody who wants game updates.
#
# NO SCHEDULE, on purpose. This is not a job that watches for a condition
# - it is a button somebody presses when there is something to say. A
# cron here would eventually fire on its own and mail people about a
# launch that happened weeks ago.
#
# Sending once per person per campaign is enforced in the database, not
# here, so a double click, a retry or a re-run cannot produce a second
# email. See supabase/migrations/0056_email_product_news.sql.
name: Announcement email

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Which file in scripts/campaigns/ (without .mjs)"
        type: string
        required: true
        default: "nameplate-launch"
      dry_run:
        description: "List who would be emailed without sending anything"
        type: boolean
        default: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No install step: the script uses fetch and the standard library
      # only, so there is nothing to pull and nothing to audit.
      - name: Send
        run: node scripts/send-announcement.mjs
        env:
          CAMPAIGN: ${{ inputs.campaign }}
          # Either name - the app's own vars are NEXT_PUBLIC_ prefixed
          # because Next requires that for anything the browser reads, so
          # a workflow asking for the bare name can silently get an empty
          # string. Accepting both means it works whichever convention a
          # secret was added under.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Good for two calls and nothing else - it is NOT the service
          # role key, and must never be replaced with one.
          EMAIL_SENDER_TOKEN: ${{ secrets.EMAIL_SENDER_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Required by CAN-SPAM in commercial mail. The script refuses
          # to run without it rather than shipping a placeholder.
          EMAIL_POSTAL_ADDRESS: ${{ secrets.EMAIL_POSTAL_ADDRESS }}
          SITE_URL: https://sidelinebrew.com
          # Defaults to a dry run, so the first thing anybody does by
          # hand cannot be an accidental send to the whole list.
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
